<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Full-Stack Developer &amp; IT Operations portfolio featuring SaaS automation, API integrations, Microsoft Entra ID &amp; Uptime Kuma monitoring, mobile apps, and NGO systems." />
  <title>John Bricks F. Ireneo — Software Developer &amp; IT Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --surface-subtle: #efece4;
      --ink: #161615;
      --ink-muted: #575651;
      --border: #dfddd4;
      --border-strong: #b9b6aa;
      --accent: #1e4d3b;
      --radius: 6px;
      --max-width: 1080px;
      --font-scale: 1;
      --mono: "JetBrains Mono", "Consolas", monospace;
      --sans: "Plus Jakarta Sans", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; font-size: calc(16px * var(--font-scale)); }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Navigation */
    header.site-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247, 246, 242, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      gap: 16px;
      flex-wrap: wrap;
    }
    .nav-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .nav-brand { font-weight: 700; font-size: 0.98rem; letter-spacing: -0.01em; color: var(--ink); }
    .nav-status {
      font-family: var(--mono);
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      font-weight: 600;
    }
    .nav-links { display: flex; gap: 20px; font-size: 0.88rem; }
    .nav-links a { color: var(--ink-muted); font-weight: 500; }
    .nav-links a:hover { color: var(--ink); text-decoration: none; }

    /* Section Surfaces & Spacing */
    section.cms-section { transition: background 0.15s ease; }
    section.has-divider { border-bottom: 1px solid var(--border); }
    section.pad-compact { padding: 30px 0; }
    section.pad-normal { padding: 48px 0; }
    section.pad-spacious { padding: 68px 0; }
    section.surface-paper { background: var(--bg); color: var(--ink); }
    section.surface-white { background: var(--surface); color: var(--ink); }
    section.surface-subtle { background: var(--surface-subtle); color: var(--ink); }
    section.surface-ink { background: #161615; color: #f7f6f2; }
    section.surface-ink .hero-lead,
    section.surface-ink .section-num,
    section.surface-ink .card p,
    section.surface-ink .panel p,
    section.surface-ink .card-meta,
    section.surface-ink .card-foot { color: #c7c4ba; }
    section.surface-ink .card,
    section.surface-ink .panel,
    section.surface-ink .facts-ledger { background: #1f1f1d; border-color: #34332f; color: #f7f6f2; }

    /* Hero */
    .hero-grid {
      display: grid;
      grid-template-columns: 1.45fr 0.85fr;
      gap: 40px;
      align-items: start;
    }
    .kicker {
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.05rem, 4vw, 3.1rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    .hero-lead {
      max-width: 640px;
      color: var(--ink-muted);
      font-size: 1.02rem;
      margin: 18px 0 28px;
    }
    .cta-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.88rem;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    .btn:hover { border-color: var(--ink); text-decoration: none; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    .btn.primary:hover { filter: brightness(0.92); }

    .facts-ledger {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 20px;
    }
    .fact-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.86rem;
    }
    .fact-row:last-child { border-bottom: none; }
    .fact-label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .fact-val { font-weight: 600; text-align: right; }

    /* Section Headers & Filters */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .section-num {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--ink-muted);
      display: block;
      margin-bottom: 4px;
    }
    h2 { font-size: 1.45rem; margin: 0; letter-spacing: -0.02em; font-weight: 700; }
    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink-muted);
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .filter-btn:hover { border-color: var(--border-strong); color: var(--ink); }
    .filter-btn.active { background: var(--ink); border-color: var(--ink); color: #ffffff; }

    /* Project Grids */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .project-grid.cols-3-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .project-grid.list-grid { grid-template-columns: 1fr; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card:hover { border-color: var(--border-strong); }
    .card.featured { grid-column: span 2; }

    .media-frame {
      height: 200px;
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card.featured .media-frame { height: 220px; }
    .media-frame img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
    .media-frame.logo-frame { background: #ffffff; padding: 28px; }
    .media-frame.logo-frame img { object-fit: contain; max-height: 130px; width: auto; cursor: default; }

    .metrics-frame {
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .metric-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
    }
    .metric-num { font-family: var(--mono); font-size: 1.05rem; font-weight: 600; color: var(--accent); line-height: 1.2; }
    .metric-label { font-size: 0.76rem; font-weight: 600; color: var(--ink); margin-top: 2px; }
    .metric-sub { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-muted); margin-top: 2px; }

    .deck-frame {
      background: #1c1b18;
      color: #f7f6f2;
      border-bottom: 1px solid var(--border);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 150px;
    }
    .deck-badge { font-family: var(--mono); font-size: 0.72rem; color: #d6c592; letter-spacing: 0.05em; text-transform: uppercase; }
    .deck-title { font-size: 1.12rem; font-weight: 700; margin: 6px 0 4px; }
    .deck-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #f7f6f2;
      border: 1px solid rgba(247, 246, 242, 0.3);
      padding: 6px 12px;
      border-radius: 4px;
      width: fit-content;
    }
    .deck-link:hover { background: rgba(247, 246, 242, 0.1); text-decoration: none; }

    .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-family: var(--mono);
      font-size: 0.73rem;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .card-meta .cat-accent { color: var(--accent); font-weight: 600; }
    .card h3 { margin: 0 0 8px; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
    .card p { margin: 0 0 16px; color: var(--ink-muted); font-size: 0.9rem; flex: 1; }
    .spec-note {
      font-family: var(--mono);
      font-size: 0.76rem;
      color: var(--ink-muted);
      background: var(--surface-subtle);
      border-left: 2px solid var(--accent);
      padding: 8px 12px;
      margin-bottom: 14px;
    }
    .tech-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tech {
      font-family: var(--mono);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--ink);
    }
    .card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--ink-muted);
    }
    .card-foot a { font-weight: 600; color: var(--accent); }

    /* Multi-Column Panels */
    .cols-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .cols-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .stack-rows { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .panel h4 { margin: 0 0 8px; font-size: 0.95rem; font-weight: 700; }
    .panel .sub-meta { font-family: var(--mono); font-size: 0.75rem; color: var(--accent); margin-bottom: 8px; display: block; }
    .panel p { margin: 0; color: var(--ink-muted); font-size: 0.88rem; }

    /* Footer */
    footer { padding: 36px 0 56px; color: var(--ink-muted); font-size: 0.88rem; }
    .footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .footer-links { display: flex; gap: 18px; flex-wrap: wrap; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; background: rgba(22, 22, 21, 0.86);
      display: none; align-items: center; justify-content: center; padding: 24px; z-index: 50;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 94vw; max-height: 90vh; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }

    /* Developer CMS Studio Drawer (Hidden by default; open via ?edit=1 or Ctrl+Shift+E) */
    .cms-launcher {
      position: fixed; right: 18px; bottom: 18px; z-index: 90;
      background: #161615; color: #f7f6f2; border: 1px solid #3d3c37;
      border-radius: 6px; padding: 8px 14px; font-family: var(--mono); font-size: 0.76rem;
      cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    .cms-launcher.hidden { display: none; }
    .cms-drawer {
      position: fixed; top: 0; right: -440px; width: 420px; max-width: 96vw; height: 100vh;
      background: #ffffff; color: #161615; border-left: 1px solid #dfddd4; z-index: 100;
      display: flex; flex-direction: column; transition: right 0.2s ease;
      box-shadow: -12px 0 36px rgba(0, 0, 0, 0.14);
      font-family: var(--sans);
    }
    .cms-drawer.open { right: 0; }
    .cms-head {
      padding: 14px 16px; border-bottom: 1px solid #dfddd4; background: #f7f6f2;
      display: flex; justify-content: space-between; align-items: center;
    }
    .cms-head strong { font-size: 0.92rem; }
    .cms-tabs { display: flex; border-bottom: 1px solid #dfddd4; background: #faf9f6; }
    .cms-tab-btn {
      flex: 1; padding: 10px 8px; border: none; background: transparent; cursor: pointer;
      font-size: 0.78rem; font-weight: 600; color: #575651; border-bottom: 2px solid transparent;
    }
    .cms-tab-btn.active { color: #1e4d3b; border-bottom-color: #1e4d3b; background: #ffffff; }
    .cms-body { flex: 1; overflow-y: auto; padding: 14px 16px; font-size: 0.82rem; }
    .cms-group { border: 1px solid #dfddd4; border-radius: 6px; padding: 12px; margin-bottom: 12px; background: #faf9f6; }
    .cms-group-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 10px; font-size: 0.8rem; }
    .cms-label { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; font-size: 0.74rem; font-weight: 600; color: #575651; }
    .cms-input { width: 100%; padding: 6px 8px; border: 1px solid #cfcdc3; border-radius: 4px; font-size: 0.8rem; font-family: inherit; background: #ffffff; color: #161615; }
    .cms-color { width: 100%; height: 32px; border: 1px solid #cfcdc3; border-radius: 4px; padding: 2px; cursor: pointer; }
    .cms-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cms-check { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; margin-top: 6px; cursor: pointer; }
    .cms-list { display: flex; flex-direction: column; gap: 6px; }
    .cms-list-item { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid #dfddd4; border-radius: 4px; background: #ffffff; }
    .cms-list-item.selected { border-color: #1e4d3b; background: #eef5f2; }
    .cms-item-select { border: none; background: transparent; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 6px; flex: 1; font-size: 0.78rem; font-weight: 600; color: #161615; overflow: hidden; }
    .cms-mono { font-family: var(--mono); color: #575651; font-size: 0.7rem; }
    .cms-pill { font-family: var(--mono); font-size: 0.65rem; background: #efece4; padding: 1px 5px; border-radius: 3px; color: #575651; }
    .cms-item-actions { display: flex; gap: 3px; }
    .cms-icon-btn { border: 1px solid #dfddd4; background: #ffffff; border-radius: 3px; padding: 2px 6px; cursor: pointer; font-size: 0.72rem; }
    .cms-icon-btn.danger { color: #991b1b; }
    .cms-btn-sm { padding: 6px 10px; border: 1px solid #cfcdc3; border-radius: 4px; background: #ffffff; cursor: pointer; font-size: 0.76rem; font-weight: 600; }
    .cms-btn-sm.primary { background: #1e4d3b; border-color: #1e4d3b; color: #ffffff; }
    .cms-btn-sm.danger { color: #991b1b; border-color: #fca5a5; }
    .cms-auth-backdrop {
      position: fixed; inset: 0; background: rgba(22, 22, 21, 0.72); z-index: 120;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .cms-auth-backdrop.open { display: flex; }
    .cms-auth-card {
      width: 360px; max-width: 100%; background: #ffffff; color: #161615;
      border: 1px solid #dfddd4; border-radius: 6px; padding: 20px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
    }

    @media (max-width: 820px) {
      .hero-grid, .project-grid, .project-grid.cols-3-grid, .cols-3, .cols-2, .cols-4 {
        grid-template-columns: 1fr;
      }
      .card.featured { grid-column: span 1; }
    }
  </style>
</head>

      <button type="button" class="cms-tab-btn" data-tab="system">System Settings</button>
